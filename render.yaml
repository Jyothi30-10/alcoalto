services:
  # FastAPI Backend Service on Render
  - type: web
    name: alcoalto-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./alcoalto.db
      - key: CORS_ORIGINS
        value: "*"
      - key: DEVICE_API_KEY
        value: alcoalto-esp32-secret-key

  # Static Site Frontend on Render
  - type: web
    name: alcoalto-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    rootDir: frontend
    envVars:
      - key: VITE_API_BASE_URL
        value: https://alcoalto-backend.onrender.com
